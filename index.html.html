<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Billing Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: sticky header with sync status, year chips, KPI strip, monthly stacked chart beside status split, partner table, open-balance list. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#13202b; --ink2:#46586a; --muted:#76879a; --line:#dce3ea;
  --billed:#1d6fa5; --balance:#d9822b; --good:#23845a; --crit:#bf3b2b; --chip:#e8eef4;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d151c; --surface:#15202a; --ink:#e8eef3; --ink2:#a8b8c5; --muted:#7b8c9a; --line:#263541;
  --billed:#5aaae0; --balance:#f0a45c; --good:#4cc08a; --crit:#f08070; --chip:#1f2d3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d151c; --surface:#15202a; --ink:#e8eef3; --ink2:#a8b8c5; --muted:#7b8c9a; --line:#263541;
  --billed:#5aaae0; --balance:#f0a45c; --good:#4cc08a; --crit:#f08070; --chip:#1f2d3a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--font-head);font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:24px} h2{font-size:15px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.sync{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--good)} .dot.busy{background:var(--balance)} .dot.err{background:var(--crit)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px}
.btn:hover{border-color:var(--muted)}
:focus-visible{outline:2px solid var(--billed);outline-offset:2px}
.bar-controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:4px 12px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0;width:220px;max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.kpi .lab{color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font-family:var(--font-head);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .sub{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.legend{display:flex;gap:14px;color:var(--ink2);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font-family:var(--font-body);font-size:11px}
.gridline{stroke:var(--line);stroke-width:1}
.bar rect{stroke:var(--surface);stroke-width:2}
.bar:hover rect{opacity:.85}
.split{display:flex;flex-direction:column;gap:14px}
.split .row .t{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.split .track{height:8px;background:var(--chip);border-radius:4px;margin-top:5px;overflow:hidden}
.split .fill{height:100%;border-radius:4px}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap-t{white-space:normal;min-width:180px}
th{font-weight:500;color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
th button{background:none;border:0;padding:0;text-transform:inherit;letter-spacing:inherit;color:inherit;font-weight:inherit}
th button[aria-sort]::after{content:" ▾"} th button[aria-sort="ascending"]::after{content:" ▴"}
td.n,th.n{text-align:right}
.share{display:inline-block;height:6px;border-radius:3px;background:var(--balance);vertical-align:middle;margin-right:8px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--ink2)}
.pill.COMPLIANCE{color:var(--crit);border-color:var(--crit)} .pill.PENDING{color:var(--balance);border-color:var(--balance)} .pill.CLOSED{color:var(--good);border-color:var(--good)}
.msg{padding:18px;border:1px dashed var(--line);border-radius:8px;color:var(--ink2)}
.msg b{color:var(--ink)}
.foot{color:var(--muted);font-size:12px}
.foot ul{margin:6px 0 0;padding-left:18px}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;font-variant-numeric:tabular-nums;display:none;white-space:nowrap}
.more{margin-top:10px}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .3s}}
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>Billing Dashboard</h1>
      <div class="sync" id="sync"><span class="dot busy" id="dot"></span><span id="syncText">Connecting to Google Drive…</span>
        <button class="btn" id="refresh" type="button">Refresh now</button></div>
    </div>
    <div class="bar-controls">
      <div class="chips" id="years" role="group" aria-label="Year"></div>
      <input type="search" id="q" placeholder="Filter by partner" aria-label="Filter by partner">
    </div>
  </div>

  <div id="notice"></div>

  <div class="kpis" id="kpis"></div>

  <div class="grid2">
    <section class="card">
      <div class="head"><h2 id="chartTitle">Billing by month</h2>
        <div class="legend"><span><i style="background:var(--billed)"></i>Billed</span><span><i style="background:var(--balance)"></i>Balance</span></div></div>
      <div id="chart"></div>
    </section>
    <section class="card">
      <div class="head"><h2>Status of records</h2></div>
      <div class="split" id="status"></div>
    </section>
  </div>

  <section class="card">
    <div class="head"><h2>Partners</h2><span class="foot" id="partnerCount"></span></div>
    <div class="scroll"><table id="partners"></table></div>
    <button class="btn more" id="morePartners" type="button" hidden></button>
  </section>

  <section class="card">
    <div class="head"><h2>Open balances</h2>
      <div class="chips" id="obChips" role="group" aria-label="Status filter"></div></div>
    <div class="scroll"><table id="open"></table></div>
    <div class="foot" id="openNote"></div>
  </section>

  <div class="foot" id="sources"></div>
</div>
<div id="tip" role="tooltip"></div>

<script>
(function(){
var FOLDER='1kcwGTw2FtFKV9Ev6s-psoO8_nizaho5n', SERVER='Google Drive', POLL_MS=60000;
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var peso=new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP',maximumFractionDigits:0});
var num=new Intl.NumberFormat('en-US');
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function compact(v){var a=Math.abs(v);if(a>=1e6)return '₱'+(v/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M';if(a>=1e3)return '₱'+(v/1e3).toFixed(a>=1e4?0:1).replace(/\.0$/,'')+'K';return '₱'+v}

var S={files:{},year:'all',q:'',ob:'all',sort:{k:'balance',dir:-1},showAll:false,mcp:null,loading:false,again:false,started:false,lastSync:null,err:null,progress:''};

/* ---------- parsing ---------- */
function splitCsv(s){var out=[],cur='',q=false;for(var i=0;i<s.length;i++){var ch=s[i];
  if(q){if(ch==='"'){if(s[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;else if(ch===','){out.push(cur);cur=''}else cur+=ch}
  out.push(cur);return out}
function fix(s){s=(s||'').replace(/\\([&_*\\])/g,'$1').trim();
  try{if(/[ÃÂ]/.test(s))s=decodeURIComponent(escape(s))}catch(e){}return s}
function parseRows(text){
  var chunks=text.split(/\s(?=20\d\d,\d{1,2},\d{1,2}\/\d{1,2}\/\d{4},)/),out=[];
  for(var i=0;i<chunks.length;i++){var c=chunks[i];
    if(!/^20\d\d,\d{1,2},/.test(c))continue;
    var f=splitCsv(c.trim());if(f.length<11)continue;
    var rem=fix(f[11]);if(rem==='0')rem='';
    out.push({y:+f[0],m:+f[1],jo:fix(f[4])||'—',amt:parseFloat(f[6])||0,partner:fix(f[7])||'(Unassigned)',
      pay:(f[9]||'').trim().toUpperCase(),status:(f[10]||'').trim().toUpperCase(),rem:rem});
  }
  return out}

/* ---------- Drive ---------- */
function isSheet(f){return /\.(xlsx|xlsm|csv)$/i.test(f.title||'')||/spreadsheet/.test(f.mimeType||'')}
async function listFiles(){
  var all=[],token;
  for(var p=0;p<5;p++){
    var input={query:"'"+FOLDER+"' in ancestors and trashed = false",pageSize:100,excludeContentSnippets:true};
    if(token)input.pageToken=token;
    var r=await S.mcp.callTool(SERVER,'search_files',input,{cache:false});
    var pl=r.payload;if(typeof pl==='string'){try{pl=JSON.parse(pl)}catch(e){pl={}}}
    all=all.concat((pl&&pl.files)||[]);token=pl&&pl.nextPageToken;if(!token)break}
  return all.filter(isSheet)}
async function readFile(f){
  var r=await S.mcp.callTool(SERVER,'read_file_content',{fileId:f.id},{cache:false,signal:AbortSignal.timeout(170000)});
  var p=r.payload,t;
  if(typeof p==='string'){t=p;try{var j=JSON.parse(p);if(j&&j.fileContent)t=j.fileContent}catch(e){}}
  else if(p&&p.fileContent)t=p.fileContent;
  else t=(r.content||[]).map(function(b){return b.text||''}).join('\n');
  return parseRows(t||'')}
function version(f){return f.etag||f.modifiedTime||''}

async function sync(manual){
  if(!S.mcp)return;
  if(S.loading){S.again=true;return}
  S.loading=true;setStatus('busy','Checking folder…');
  try{
    var files=await listFiles();
    var ids={};files.forEach(function(f){ids[f.id]=1});
    Object.keys(S.files).forEach(function(id){if(!ids[id]){delete S.files[id]}});
    var todo=files.filter(function(f){return !S.files[f.id]||S.files[f.id].v!==version(f)});
    for(var i=0;i<todo.length;i++){
      var f=todo[i];S.progress='Reading '+f.title+' ('+(i+1)+'/'+todo.length+')…';setStatus('busy',S.progress);
      var rows=await readFile(f);
      S.files[f.id]={v:version(f),title:f.title,modified:f.modifiedTime,rows:rows};
      renderAll();
    }
    S.err=null;S.lastSync=new Date();S.started=true;
  }catch(e){S.err=e;}
  S.loading=false;S.progress='';
  renderAll();
  if(S.again){S.again=false;sync()}
}

function setStatus(kind,text){$('dot').className='dot '+kind;$('syncText').textContent=text}
function errorMessage(e){
  var c=e&&e.code;
  var m={needs_reauth:['Google Drive needs to be reconnected.','Open Settings → Connectors in claude.ai, reconnect Google Drive, then reload this page.'],
   server_not_connected:['Google Drive is not connected.','Add Google Drive in Settings → Connectors in claude.ai, then reload.'],
   selection_required:['More than one Google Drive connector found.','Choose one when claude.ai asks, then reload.'],
   not_in_manifest:['Access to Google Drive was not allowed for this page.','Reload and choose Allow when asked.'],
   consent_required:['Access to Google Drive was not allowed for this page.','Reload and choose Allow when asked.'],
   approval_required:['Google Drive access needs your approval.','Press Refresh now and choose Allow.'],
   blocked_by_policy:['Your organization blocks this Google Drive tool.','Ask an admin to allow it.'],
   cancelled:['Reading a file took too long.','Press Refresh now to try again.'],
   server_unavailable:['Google Drive did not respond.','It will retry automatically in a minute.']}[c];
  if(m)return m;
  return ['Could not read the folder'+(e&&e.message?' ('+e.message.slice(0,140)+')':'')+'.','The last loaded data stays on screen. Press Refresh now to try again.']}

/* ---------- aggregation ---------- */
function allRows(){var r=[];Object.keys(S.files).forEach(function(id){r=r.concat(S.files[id].rows)});return r}
function filtered(){var q=S.q.toLowerCase();
  return allRows().filter(function(r){return (S.year==='all'||r.y==S.year)&&(!q||r.partner.toLowerCase().indexOf(q)>-1)})}
function sum(rows){var o={n:0,total:0,billed:0,balance:0,nb:0,nbal:0};
  rows.forEach(function(r){o.n++;o.total+=r.amt;if(r.pay==='BILLED'){o.billed+=r.amt;o.nb++}else{o.balance+=r.amt;o.nbal++}});return o}

/* ---------- render ---------- */
function renderAll(){
  var rows=allRows();
  if(S.err){var m=errorMessage(S.err);setStatus('err',m[0]);$('notice').innerHTML='<div class="msg"><b>'+esc(m[0])+'</b> '+esc(m[1])+'</div>'}
  else{$('notice').innerHTML='';
    if(S.loading)setStatus('busy',S.progress||'Checking folder…');
    else if(S.lastSync)setStatus('live','Live · last checked '+S.lastSync.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' · refreshes every minute')}
  if(!rows.length){
    $('kpis').innerHTML='<div class="msg" style="grid-column:1/-1"><b>'+(S.loading?'Loading billing data from your Drive folder…':'No billing rows found yet.')+'</b> '+
      (S.loading?'Large Excel files can take a minute the first time.':'Add or edit an Excel file in the folder and this page picks it up on the next check.')+'</div>';
    ['chart','status','partners','open'].forEach(function(id){$(id).innerHTML=''});$('years').innerHTML='';$('obChips').innerHTML='';return}
  renderYears(rows);renderKpis();renderChart();renderStatus();renderPartners();renderOpen();renderSources()}

function renderYears(rows){var ys={};rows.forEach(function(r){ys[r.y]=1});
  var list=Object.keys(ys).sort(function(a,b){return b-a});
  var h='<button class="chip" type="button" data-year="all" aria-pressed="'+(S.year==='all')+'">All years</button>';
  list.forEach(function(y){h+='<button class="chip" type="button" data-year="'+y+'" aria-pressed="'+(S.year==y)+'">'+y+'</button>'});
  $('years').innerHTML=h}

function renderKpis(){var t=sum(filtered()),rate=t.total?t.billed/t.total*100:0;
  function k(l,v,s){return '<div class="card kpi"><div class="lab">'+l+'</div><div class="val">'+v+'</div><div class="sub">'+s+'</div></div>'}
  $('kpis').innerHTML=k('Total invoiced',peso.format(t.total),num.format(t.n)+' records')+
    k('Billed',peso.format(t.billed),num.format(t.nb)+' records')+
    k('Balance',peso.format(t.balance),num.format(t.nbal)+' records not yet billed')+
    k('Billed rate',rate.toFixed(1)+'%','of total invoiced')}

function niceMax(v){if(v<=0)return 4;var e=Math.pow(10,Math.floor(Math.log10(v/4))),s=[1,2,2.5,5,10];
  for(var i=0;i<s.length;i++){if(s[i]*e*4>=v)return s[i]*e*4}return 10*e*4}
function renderChart(){var rows=filtered(),groups=[],byYear=S.year==='all';
  if(byYear){var ys={};rows.forEach(function(r){(ys[r.y]=ys[r.y]||[]).push(r)});
    Object.keys(ys).sort().forEach(function(y){var s=sum(ys[y]);s.label=y;groups.push(s)});$('chartTitle').textContent='Billing by year'}
  else{for(var m=1;m<=12;m++){var s=sum(rows.filter(function(r){return r.m===m}));s.label=MONTHS[m-1];groups.push(s)}$('chartTitle').textContent='Billing by month, '+S.year}
  var W=640,H=270,L=46,R=6,T=10,B=26,max=niceMax(Math.max.apply(null,groups.map(function(g){return g.total}))),
    pw=W-L-R,ph=H-T-B,band=pw/groups.length,bw=Math.min(46,band*.62),svg='';
  for(var i=0;i<=4;i++){var v=max/4*i,y=T+ph-ph*(v/max);
    svg+='<line class="gridline" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+compact(v)+'</text>'}
  groups.forEach(function(g,i){var x=L+band*i+(band-bw)/2,hb=ph*g.billed/max,hl=ph*g.balance/max,yb=T+ph-hb,yl=yb-hl;
    svg+='<g class="bar" data-i="'+i+'">';
    if(hb>0)svg+='<rect x="'+x+'" y="'+yb+'" width="'+bw+'" height="'+hb+'" rx="2" fill="var(--billed)"/>';
    if(hl>0)svg+='<rect x="'+x+'" y="'+yl+'" width="'+bw+'" height="'+hl+'" rx="2" fill="var(--balance)"/>';
    svg+='<rect x="'+(L+band*i)+'" y="'+T+'" width="'+band+'" height="'+ph+'" fill="transparent" style="stroke:none"/></g>';
    svg+='<text x="'+(L+band*i+band/2)+'" y="'+(H-8)+'" text-anchor="middle">'+g.label+'</text>'});
  $('chart').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Stacked bars of billed and balance amounts">'+svg+'</svg>';
  S.groups=groups}

function renderStatus(){var rows=filtered(),by={};
  rows.forEach(function(r){var k=r.status||'OTHER';var o=by[k]=by[k]||{n:0,amt:0};o.n++;o.amt+=r.amt});
  var keys=Object.keys(by).sort(function(a,b){return by[b].amt-by[a].amt}),tot=rows.reduce(function(s,r){return s+r.amt},0)||1,
    col={CLOSED:'var(--good)',PENDING:'var(--balance)',COMPLIANCE:'var(--crit)'},h='';
  keys.forEach(function(k){var o=by[k];
    h+='<div class="row"><div class="t"><span><span class="pill '+esc(k)+'">'+esc(k.charAt(0)+k.slice(1).toLowerCase())+'</span> <span class="foot">'+num.format(o.n)+' records</span></span><span>'+peso.format(o.amt)+'</span></div>'+
      '<div class="track"><div class="fill" style="width:'+(o.amt/tot*100).toFixed(1)+'%;background:'+(col[k]||'var(--muted)')+'"></div></div></div>'});
  $('status').innerHTML=h||'<div class="foot">No records for this filter.</div>'}

function renderPartners(){var rows=filtered(),map={};
  rows.forEach(function(r){var o=map[r.partner]=map[r.partner]||{partner:r.partner,n:0,billed:0,balance:0};o.n++;if(r.pay==='BILLED')o.billed+=r.amt;else o.balance+=r.amt});
  var list=Object.keys(map).map(function(k){var o=map[k];o.total=o.billed+o.balance;o.pct=o.total?o.balance/o.total*100:0;return o}),sk=S.sort.k,d=S.sort.dir;
  list.sort(function(a,b){return (sk==='partner'?a.partner.localeCompare(b.partner):a[sk]-b[sk])*d});
  var maxBal=Math.max.apply(null,list.map(function(o){return o.balance}).concat([1])),shown=S.showAll?list:list.slice(0,15);
  function th(k,l,cls){return '<th class="'+(cls||'')+'"><button type="button" data-sort="'+k+'"'+(sk===k?' aria-sort="'+(d>0?'ascending':'descending')+'"':'')+'>'+l+'</button></th>'}
  var h='<thead><tr>'+th('partner','Partner')+th('n','Records','n')+th('billed','Billed','n')+th('balance','Balance','n')+th('pct','Balance %','n')+'</tr></thead><tbody>';
  shown.forEach(function(o){h+='<tr><td class="wrap-t">'+esc(o.partner)+'</td><td class="n">'+num.format(o.n)+'</td><td class="n">'+peso.format(o.billed)+'</td><td class="n"><span class="share" style="width:'+Math.round(o.balance/maxBal*60)+'px"></span>'+peso.format(o.balance)+'</td><td class="n">'+o.pct.toFixed(0)+'%</td></tr>'});
  $('partners').innerHTML=h+'</tbody>';
  $('partnerCount').textContent=num.format(list.length)+' partners';
  var b=$('morePartners');b.hidden=list.length<=15;b.textContent=S.showAll?'Show top 15 only':'Show all '+num.format(list.length)+' partners'}

function renderOpen(){var rows=filtered().filter(function(r){return r.pay!=='BILLED'}),cnt={all:rows.length};
  rows.forEach(function(r){cnt[r.status]=(cnt[r.status]||0)+1});
  var opts=['all','PENDING','COMPLIANCE'],h='';
  opts.forEach(function(o){h+='<button class="chip" type="button" data-ob="'+o+'" aria-pressed="'+(S.ob===o)+'">'+(o==='all'?'All':o.charAt(0)+o.slice(1).toLowerCase())+' '+num.format(cnt[o]||0)+'</button>'});
  $('obChips').innerHTML=h;
  var list=rows.filter(function(r){return S.ob==='all'||r.status===S.ob});
  list.sort(function(a,b){return b.y-a.y||b.m-a.m});
  var lim=list.slice(0,150),t='<thead><tr><th>Period</th><th>JO number</th><th>Partner</th><th class="n">Amount</th><th>Status</th><th>Remarks</th></tr></thead><tbody>';
  lim.forEach(function(r){t+='<tr><td>'+MONTHS[(r.m||1)-1]+' '+r.y+'</td><td>'+esc(r.jo)+'</td><td class="wrap-t">'+esc(r.partner)+'</td><td class="n">'+peso.format(r.amt)+'</td><td><span class="pill '+esc(r.status)+'">'+esc(r.status||'—')+'</span></td><td class="wrap-t">'+esc(r.rem||'—')+'</td></tr>'});
  $('open').innerHTML=t+'</tbody>';
  $('openNote').textContent=list.length>150?'Showing the latest 150 of '+num.format(list.length)+' records.':(list.length?'':'Nothing open for this filter.')}

function renderSources(){var ids=Object.keys(S.files).sort(function(a,b){return S.files[a].title.localeCompare(S.files[b].title)});
  $('sources').innerHTML='Sources in the Drive folder<ul>'+ids.map(function(id){var f=S.files[id];
    return '<li>'+esc(f.title)+' · '+num.format(f.rows.length)+' rows · edited '+esc(new Date(f.modified).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}))+'</li>'}).join('')+'</ul>'}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-year],[data-sort],[data-ob],#refresh,#morePartners');if(!t)return;
  if(t.id==='refresh'){sync(true);return}
  if(t.id==='morePartners'){S.showAll=!S.showAll}
  else if(t.dataset.year){S.year=t.dataset.year}
  else if(t.dataset.ob){S.ob=t.dataset.ob}
  else if(t.dataset.sort){var k=t.dataset.sort;S.sort=S.sort.k===k?{k:k,dir:-S.sort.dir}:{k:k,dir:k==='partner'?1:-1}}
  if(Object.keys(S.files).length)renderAll()});
$('q').addEventListener('input',function(e){S.q=e.target.value.trim();if(Object.keys(S.files).length)renderAll()});
var tip=$('tip');
document.addEventListener('pointermove',function(e){var g=e.target.closest&&e.target.closest('.bar');
  if(!g||!S.groups){tip.style.display='none';return}
  var d=S.groups[+g.dataset.i];if(!d)return;
  tip.innerHTML='<b>'+esc(d.label)+'</b><br>Billed '+peso.format(d.billed)+'<br>Balance '+peso.format(d.balance)+'<br>Total '+peso.format(d.total);
  tip.style.display='block';tip.style.left=Math.min(e.clientX+14,window.innerWidth-tip.offsetWidth-8)+'px';tip.style.top=(e.clientY+14)+'px'});
document.addEventListener('pointerleave',function(){tip.style.display='none'});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.mcp&&S.lastSync&&Date.now()-S.lastSync>POLL_MS)sync()});

/* ---------- boot ---------- */
renderAll();
(async function(){
  var c=window.claude;
  var mcp=c&&c.use?await c.use('mcp'):null;
  if(!mcp){setStatus('err','Live data is available only when this page is opened in Claude.');
    $('kpis').innerHTML='<div class="msg" style="grid-column:1/-1"><b>No connection to Google Drive.</b> Open this page from your Claude artifacts, signed in, with Google Drive connected.</div>';return}
  S.mcp=mcp;sync();
  setInterval(function(){if(!document.hidden)sync()},POLL_MS);
})();
})();
</script>
